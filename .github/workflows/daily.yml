# 每个工作日自动抓取数据 → 提交到仓库 → 构建 → 部署到 GitHub Pages
# 手动触发：GitHub 仓库页面 → Actions → daily-update → Run workflow
name: daily-update

on:
  schedule:
    # Daily retries include weekends for delayed Friday publications.
    # UTC is fixed; London is UTC+1 during British Summer Time.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Test daily data selection
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Fetch market data
        run: python scripts/fetch_daily.py

      - name: Commit data
        run: |
          git config user.name "crisis-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build site
        run: |
          npm ci
          node --test tests/freshness.test.mjs
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check update health after publishing
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('public/data/latest.json').read_text())
          delayed = data['freshness'].get('delayed_indicators', [])
          lines = ['## Data update health', '', '| Indicator | Observation date | Fetch status |', '| --- | --- | --- |']
          for key, info in data['meta'].items():
              lines.append(f"| {key} | {info['as_of']} | {info.get('fetch_status', 'unknown')} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('\n'.join(lines))
          # Publish retained observations first, then make a genuine delay visible
          # in Actions. The next hourly run retries automatically.
          missing = [k for k in ['credit_spread','uk_10y','vix','us_10y','brent','gbp_cny','gold','dxy'] if k not in data['values']]
          if delayed or missing:
              raise SystemExit(f'Update needs recovery; delayed={delayed}, missing={missing}. Retained observations are already published.')
          PY
